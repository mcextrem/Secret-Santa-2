<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adventskalender-Wichteln | Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🎄 Adventskalender-Wichteln</h1>
    <p class="subtitle">Erstelle individuelle Wichtel-Links für deine Gruppe. Jeder Teilnehmer erstellt für eine andere Person einen Adventskalender.</p>

    <label for="participants" style="display:block; text-align:left; margin-bottom:8px; font-weight:bold;">
      Teilnehmerliste (ein Name pro Zeile):
    </label>
    <textarea id="participants" placeholder="Anna&#10;Ben&#10;Clara&#10;David&#10;Emma"></textarea>

    <button class="btn-primary" id="generate-btn">🎁 Auslosen & Links generieren</button>

    <div id="results" class="results-list" style="display:none;">
      <h2 style="color: var(--accent-gold); font-size:1.3rem;">Generierte Links</h2>
      <p style="font-size:0.9rem; color:#d1d8e0;">Kopiere die Links und sende jedem Teilnehmer seinen persönlichen Link.</p>
      <div id="links-container"></div>
    </div>
  </div>

  <script src="SecretSanta.js"></script>
  <script>
    // Schneefall-Effekt erzeugen
    function createSnow() {
      for (let i = 0; i < 30; i++) {
        const flake = document.createElement('div');
        flake.className = 'snowflake';
        flake.innerHTML = '❄';
        flake.style.left = Math.random() * 100 + 'vw';
        flake.style.animationDuration = (Math.random() * 3 + 2) + 's';
        flake.style.opacity = Math.random();
        flake.style.fontSize = (Math.random() * 10 + 10) + 'px';
        document.body.appendChild(flake);
      }
    }
    createSnow();

    document.getElementById('generate-btn').addEventListener('click', async () => {
      const rawText = document.getElementById('participants').value;
      const names = rawText.split('\n').map(n => n.trim()).filter(n => n.length > 0);

      if (names.length < 2) {
        alert("Bitte gib mindestens 2 Namen ein.");
        return;
      }

      try {
        const pairings = generatePairings(names);
        const baseUrl = window.location.href.replace(/index\.html$/, '').split('#')[0] + 'pairing.html';
        const container = document.getElementById('links-container');
        container.innerHTML = '';

        for (const pair of pairings) {
          const encryptedPayload = await encryptPairing(pair.giver, pair.receiver);
          const fullLink = `${baseUrl}#${encryptedPayload}`;

          const item = document.createElement('div');
          item.className = 'result-item';
          item.innerHTML = `
            <span class="result-name">Für ${pair.giver}:</span>
            <button class="btn-copy" onclick="copyToClipboard('${fullLink}', this)">📋 Link kopieren</button>
          `;
          container.appendChild(item);
        }

        document.getElementById('results').style.display = 'block';
      } catch (err) {
        alert("Fehler bei der Auslosung: " + err.message);
      }
    });

    function copyToClipboard(text, btnElement) {
      navigator.clipboard.writeText(text).then(() => {
        const origText = btnElement.innerText;
        btnElement.innerText = "✓ Kopiert!";
        btnElement.style.background = "#27ae60";
        setTimeout(() => {
          btnElement.innerText = origText;
        }, 2000);
      });
    }
  </script>
</body>
</html>
